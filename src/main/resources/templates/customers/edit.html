<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/default" lang="en">
<div layout:fragment="content">
    <div class="col-lg-12">
        <div class="panel panel-default">
            <div class="panel-heading">Update a customer</div>
            <div class="panel-body">
                <div class="col-md-6">
                    <form role="form" th:action="@{/customers/edit/{id}(id=${customer.id})}" th:object="${customer}" method="POST">
                        <input type="hidden" th:field="*{id}">
                        <div class="form-group" th:classappend="${#fields.hasErrors('firstName')} ? 'has-error'">
                            <label>First name :</label>
                            <input type="text" class="form-control" th:field="*{firstName}">
                            <span class="help-block" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('lastName')} ? 'has-error'">
                            <label>Last name :</label>
                            <input type="text" class="form-control" th:field="*{lastName}">
                            <span class="help-block" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('tel')} ? 'has-error'">
                            <label>Tel</label>
                            <input type="text" class="form-control" th:field="*{tel}">
                            <span class="help-block" th:if="${#fields.hasErrors('tel')}" th:errors="*{tel}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                            <label>Email</label>
                            <input type="text" class="form-control" th:field="*{email}">
                            <span class="help-block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('address')} ? 'has-error'">
                            <label>Address</label>
                            <input type="text" class="form-control" th:field="*{address}">
                            <span class="help-block" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                        </div>
                        <button type="submit" id="submit" class="btn btn-primary">Save</button>
                        <button type="reset" class="btn btn-default">Reset</button>
                    </form>
                </div>
            </div>
        </div>
    </div><!-- /.col-->
</div>
</html>
