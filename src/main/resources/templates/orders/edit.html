<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="/layouts/default">
<div layout:fragment="content">
    <div class="col-lg-12">
        <div class="panel panel-default">
            <div class="panel-heading">Update an order</div>
            <div class="panel-body">
                <div class="col-md-6">
                    <form role="form" th:action="@{/orders/edit/{id}(id=${order.id})}" th:object="${order}" method="POST">
                        <input type="hidden" th:field="*{id}">
                        <div class="form-group" th:classappend="${#fields.hasErrors('customerId')} ? 'has-error'">
                            <label>Customer</label>
                            <select class="form-control" th:field="*{customerId}">
                                <option value="">Select a customer</option>
                                <option th:each="customer: ${customers}"
                                        th:value="${customer.id}"
                                        th:text="${customer.firstName + ' ' + customer.lastName}"></option>
                            </select>
                            <span class="help-block" th:if="${#fields.hasErrors('customerId')}" th:errors="*{customerId}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('productId')} ? 'has-error'">
                            <label>Product</label>
                            <select class="form-control" th:field="*{productId}">
                                <option value="">Select a product</option>
                                <option th:each="product: ${products}"
                                        th:value="${product.id}"
                                        th:text="${product.productName}"></option>
                            </select>
                            <span class="help-block" th:if="${#fields.hasErrors('productId')}" th:errors="*{productId}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('qty')} ? 'has-error'">
                            <label>Quantity</label>
                            <input type="number" min="1" class="form-control" th:field="*{qty}">
                            <span class="help-block" th:if="${#fields.hasErrors('qty')}" th:errors="*{qty}"></span>
                        </div>
                        <div class="form-group" th:classappend="${#fields.hasErrors('total')} ? 'has-error'">
                            <label>Total</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{total}">
                            <span class="help-block" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></span>
                        </div>
                        <button type="submit" id="submit" class="btn btn-primary">Save</button>
                        <button type="reset" class="btn btn-default">Reset</button>
                    </form>
                </div>
            </div>
        </div>
    </div><!-- /.col-->
</div>
</html>
